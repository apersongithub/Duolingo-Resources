<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottie Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      background: #0f1115; color: #e6e6e6; font-family: system-ui, sans-serif; padding: 24px;
    }
    #lottie { width: min(90vw, 900px); height: min(70vh, 600px); }
    code { background:#1b1f2a; padding: 3px 6px; border-radius: 6px; word-break: break-all; }
    .err { color:#ff8a8a; margin-top:12px; text-align:center; }
  </style>
</head>
<body>
  <div id="lottie"></div>
  <div id="error" class="err"></div>

  <script>
    const params = new URLSearchParams(location.search);
    let src = params.get("src");

    // Convert raw.githubusercontent.com URL to jsDelivr
    function rawToJsDelivr(u) {
      try {
        const url = new URL(u);
        if (url.hostname === "raw.githubusercontent.com") {
          const [user, repo, branch, ...rest] = url.pathname.split("/").filter(Boolean);
          return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${rest.join("/")}`;
        }
      } catch {}
      return u;
    }

    // Convert GitHub repo JSON to Pages URL if possible (same-origin)
    function toSameOriginIfYours(u) {
      try {
        const url = new URL(u);
        const isRawYourRepo = (url.hostname === "raw.githubusercontent.com"
          && url.pathname.startsWith("/apersongithub/Duolingo-Resources/"));
        if (isRawYourRepo) {
          const [, , , ...rest] = url.pathname.split("/"); // skip user/repo/branch
          return `https://apersongithub.github.io/Duolingo-Resources/${rest.join("/")}`;
        }
      } catch {}
      return u;
    }

    async function init() {
      if (!src) {
        document.getElementById("error").textContent = 
          "Add ?src=<lottie-json-url> to the URL.";
        return;
      }

      // Prefer Pages URL, otherwise rewrite raw GitHub to jsDelivr
      src = toSameOriginIfYours(src);
      src = rawToJsDelivr(src);

      try {
        const r = await fetch(src);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        lottie.loadAnimation({
          container: document.getElementById("lottie"),
          renderer: "svg",
          loop: true,
          autoplay: true,
          path: src
        });
      } catch(e) {
        document.getElementById("error").textContent = 
          "Failed to load animation: " + e.message;
      }
    }

    init();
  </script>
</body>
</html>
