<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Lottie Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    body {
      margin: 0; display: grid; place-items: center; min-height: 100vh;
      background: #111; color: #fff; font-family: sans-serif; padding: 20px;
    }
    #lottie { width: min(90vw, 900px); height: min(70vh, 600px); }
    .err { color:#f88; text-align:center; margin-top:12px; }
    code { background:#222; padding:3px 6px; border-radius:6px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="lottie"></div>
  <div id="error" class="err"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get("src");

    if (!src) {
      document.getElementById("error").textContent =
        "Usage: ?src=<json-url>";
    } else {
      fetch(src)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json(); // attempt to parse JSON
        })
        .then(json => {
          lottie.loadAnimation({
            container: document.getElementById("lottie"),
            renderer: "svg",
            loop: true,
            autoplay: true,
            animationData: json
          });
        })
        .catch(err => {
          document.getElementById("error").textContent =
            "Failed to load/render animation:\n" + err.message + "\nURL: " + src;
        });
    }
  </script>
</body>
</html>
