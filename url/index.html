<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottie Viewer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    #lottie {
      width: 80%;
      height: 80%;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #4fc3f7;
      color: #111;
      font-weight: bold;
      margin-top: 20px;
    }
    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Lottie Animation Viewer</h2>
  <div id="info"></div>
  <button id="playBtn" style="display:none;">▶ Play Animation</button>
  <div id="lottie"></div>

  <!-- Lottie player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    // Get everything after "/url/"
    const pathPart = window.location.pathname.split("/url/")[1];
    let src;

    if (pathPart) {
      src = decodeURIComponent(pathPart);
    }

    if (!src) {
      document.getElementById("info").innerHTML = `
        <p>No animation source provided.</p>
        <p>Usage:<br>
          <code>https://yourusername.github.io/repo/url/&lt;encoded-json-url&gt;</code>
        </p>`;
    } else {
      document.getElementById("info").innerHTML = `
        <p>Animation source detected:</p>
        <code>${src}</code>`;
      document.getElementById("playBtn").style.display = "inline-block";

      document.getElementById("playBtn").addEventListener("click", () => {
        lottie.loadAnimation({
          container: document.getElementById('lottie'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: src
        });
        document.getElementById("playBtn").style.display = "none"; // hide after playing
      });
    }
  </script>
</body>
</html>
