<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal GitHub Lottie Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    #lottie {
      width: min(90vw, 900px);
      height: min(70vh, 600px);
    }
    .err {
      color: #f88;
      text-align: center;
      margin-top: 12px;
    }
    code {
      background: #222;
      padding: 3px 6px;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="lottie"></div>
  <div id="error" class="err"></div>

  <script>
    const params = new URLSearchParams(location.search);
    let src = params.get("src");

    // Rewrite any raw GitHub URL to jsDelivr CORS-friendly URL
    function githubToJsDelivr(url) {
      try {
        const u = new URL(url);
        if (u.hostname === "raw.githubusercontent.com") {
          const parts = u.pathname.split("/").filter(Boolean);
          if (parts.length >= 4) {
            const user = parts[0];
            const repo = parts[1];
            let branch = parts[2];
            let pathParts = parts.slice(3);

            // Fix refs/heads/main style URLs
            if (branch === "refs" && parts[3] === "heads") {
              branch = parts[4];
              pathParts = parts.slice(5);
            }

            return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${pathParts.join("/")}`;
          }
        }
      } catch {}
      return url; // Return original if not raw GitHub
    }

    async function init() {
      if (!src) {
        document.getElementById("error").textContent =
          "Usage: ?src=<url-to-json>";
        return;
      }

      // Automatically rewrite raw GitHub URLs to jsDelivr
      src = githubToJsDelivr(src);

      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        lottie.loadAnimation({
          container: document.getElementById("lottie"),
          renderer: "svg",
          loop: true,
          autoplay: true,
          animationData: json
        });
      } catch (e) {
        document.getElementById("error").textContent =
          "Failed to load/render animation:\n" + e.message + "\nURL: " + src;
      }
    }

    init();
  </script>
</body>
</html>
