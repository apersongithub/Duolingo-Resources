<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottie Viewer</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
    }
    #lottie {
      width: 80%;
      height: 80%;
    }
  </style>
</head>
<body>
  <div id="lottie"></div>

  <!-- Lottie player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    // Grab everything after /url/
    const pathPart = window.location.pathname.split("/url/")[1];
    let src;

    if (pathPart) {
      // decode URL-safe string
      src = decodeURIComponent(pathPart);
    }

    if (!src) {
      document.body.innerHTML = "<p style='color:white'>No animation source provided.<br>Usage: https://yourusername.github.io/url/https%3A%2F%2Fexample.com%2Ffile.json</p>";
    } else {
      lottie.loadAnimation({
        container: document.getElementById('lottie'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: src // external JSON URL
      });
    }
  </script>
</body>
</html>
